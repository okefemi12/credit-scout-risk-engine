<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit-Scout | AI Risk Engine</title>
    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--primary); margin: 0; padding: 2rem; display: flex; justify-content: center; }
        .container { max-width: 1000px; width: 100%; display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        .card { background: var(--card); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1, h2 { margin-top: 0; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background-color: var(--accent); color: white; border: none; padding: 1rem; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #2563eb; }
        .result-box { display: none; margin-top: 1.5rem; padding: 1.5rem; border-radius: 8px; border-left: 5px solid; }
        .flagged { background-color: #fef2f2; border-color: #ef4444; }
        .approved { background-color: #f0fdf4; border-color: #22c55e; }
        .metric { font-size: 2rem; font-weight: bold; margin: 0.5rem 0; }
        #explanation { white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6; color: #334155; }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Column: Input Form -->
    <div class="card">
        <h2>💳 Transaction Details</h2>
        <form id="riskForm">
            <div class="form-group">
                <label>Transaction Type</label>
                <select id="txn_type">
                    <option value="TRANSFER">TRANSFER</option>
                    <option value="CASH_OUT">CASH_OUT</option>
                </select>
            </div>
            <div class="form-group">
                <label>Amount ($)</label>
                <input type="number" id="amount" value="350000" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Origin Old Balance ($)</label>
                <input type="number" id="old_balance_org" value="1200000" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Origin New Balance ($)</label>
                <input type="number" id="new_balance_orig" value="850000" step="0.01" required>
            </div>
            <button type="submit" id="submitBtn">Analyze Risk</button>
        </form>
    </div>

    <!-- Right Column: Results -->
    <div class="card">
        <h2>🏦 Risk Assessment</h2>
        <p>Submit a transaction to generate a real-time compliance report.</p>
        
        <div id="loading" style="display: none;">Analyzing risk patterns...</div>
        
        <div id="resultBox" class="result-box">
            <h3 id="statusText" style="margin: 0;"></h3>
            <div class="metric" id="riskScore"></div>
            <p><strong>Math Discrepancy:</strong> $<span id="discrepancy"></span></p>
            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 1.5rem 0;">
            <h4>📝 Audit Report (Llama 3.1)</h4>
            <div id="explanation"></div>
        </div>
    </div>
</div>

<script>
    document.getElementById('riskForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultBox = document.getElementById('resultBox');
        
        btn.disabled = true;
        loading.style.display = 'block';
        resultBox.style.display = 'none';
        
        const payload = {
            txn_type: document.getElementById('txn_type').value,
            amount: parseFloat(document.getElementById('amount').value),
            old_balance_org: parseFloat(document.getElementById('old_balance_org').value),
            new_balance_orig: parseFloat(document.getElementById('new_balance_orig').value)
        };

        try {
            const response = await fetch('/analyze-risk', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();
            
            if (response.ok) {
                document.getElementById('statusText').innerText = data.status === 'FLAGGED' ? '⛔ FLAGGED' : '✅ APPROVED';
                document.getElementById('riskScore').innerText = (data.risk_score * 100).toFixed(2) + '% Probability';
                document.getElementById('discrepancy').innerText = data.math_discrepancy.toFixed(2);
                document.getElementById('explanation').innerText = data.llm_explanation;
                
                resultBox.className = 'result-box ' + (data.status === 'FLAGGED' ? 'flagged' : 'approved');
                resultBox.style.display = 'block';
            } else {
                alert('Error: ' + data.detail);
            }
        } catch (error) {
            alert('Failed to connect to the API.');
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
        }
    });
</script>

</body>
</html>
